server.port=8080

# MySQL — local Workbench 8.0 (no Docker needed)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wastewise?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:wastewise}
spring.datasource.password=${DB_PASSWORD:wastewise123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:WasteWiseSuperSecretKeyForJWTChangeMeInProd32CharsMin!}
app.jwt.expiration-ms=86400000

# CORS allowed origins
app.cors.allowed-origins=http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000
