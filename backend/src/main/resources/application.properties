server.port=${PORT:8080}

# MySQL — Clever Cloud (prod) or local Workbench 8.0 (dev, no Docker needed)
# Clever Cloud example: jdbc:mysql://uxxxx.clever-cloud.com:3306/Bxxxx?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wastewise?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:wastewise}
spring.datasource.password=${DB_PASSWORD:wastewise123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Clever Cloud needs SSL + public key retrieval
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT — override JWT_SECRET on Render/Clever Cloud with a 32+ char random string
app.jwt.secret=${JWT_SECRET:WasteWiseSuperSecretKeyForJWTChangeMeInProd32CharsMin!}
app.jwt.expiration-ms=86400000

# CORS — add your Vercel URL(s) after deploy; supports wildcard https://*.vercel.app
# On Render set env CORS_ORIGINS=https://wastewise-nine-bay.vercel.app,https://*.vercel.app
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,https://wastewise-nine-bay.vercel.app,https://*.vercel.app}
